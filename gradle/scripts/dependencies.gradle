// This mod's own dependencies. Shared repositories, dev helpers and shading come from devenv.gradle.
// Configurations: implementation, compileOnly, runtimeOnly, annotationProcessor, shade (embedded in the jar).
apply from: 'gradle/scripts/devenv.gradle'

dependencies {
    shade files('libs/jubiconfig-2.6.5.jar')
    implementation files('libs/millenaire-8.1.2.jar')
    implementation files('libs/millmix-1.1.6.jar')
    implementation files('libs/DramaticTrees-1.12.2-0.13.4.jar')
    implementation files('libs/ultreia-b0.1.2.jar')
    implementation "curse.maven:ancient-warfare-2-tweaked-890591:6634879"
    implementation 'mezz:jei:4.29.13'
}

tasks.named('shadowJar').configure {
    // Relocated into a package unique to this mod so this mod's jubiconfig version can never
    // collide/conflict with another mod's own (possibly different) embedded jubiconfig version —
    // each mod's copy is fully private. Keep this relocate target unique per mod.
    relocate 'com.jubitus.jubiconfig', 'com.jubitus.travellers.shadow.jubiconfig'
}
