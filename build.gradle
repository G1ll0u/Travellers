/**
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask
import org.jetbrains.changelog.Changelog
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.gradleup.shadow' version '9.4.+'
}

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_tags', 'tag_class_name'
assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_booter_version', 'mixin_refmap'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'
assertSubProperties 'use_asset_mover', 'asset_mover_version'

setDefaultProperty 'use_modern_java_syntax', false, false
setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'mapping_channel', true, 'stable'
setDefaultProperty 'mapping_version', true, '39'
setDefaultProperty 'use_dependency_at_files', true, true
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''
setDefaultProperty 'extra_tweak_classes', false, ''
setDefaultProperty 'change_minecraft_sources', false, false

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

tasks.decompressDecompiledSources.enabled !propertyBool('change_minecraft_sources')

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(propertyBool('use_modern_java_syntax') ? 16 : 8))
        // Azul covers the most platforms for Java 8 toolchains, crucially including MacOS arm64
        vendor.set(JvmVendorSpec.AZUL)
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set(propertyString('mapping_channel'))
    mcpMappingVersion.set(propertyString('mapping_version'))

    useDependencyAccessTransformers.set(propertyBool('use_dependency_at_files'))

    username.set(propertyString('minecraft_username'))
    
    // Add any additional tweaker classes here
    extraTweakClasses.addAll(propertyStringList('extra_tweak_classes'))

    // Add various JVM arguments here for runtime
    def args = ['-ea:' + group]
    if (propertyBool('use_mixins')) {
        args << '-Dmixin.hotSwap=true'
        args << '-Dmixin.checks.interfaces=true'
        args << '-Dmixin.debug.export=true'
    }
    extraRunJvmArguments.addAll(args)
    extraRunJvmArguments.addAll(propertyStringList('extra_jvm_args'))

    if (propertyBool('use_tags')) {
        if (file('tags.properties').exists()) {
            Properties props = new Properties().tap {  it.load(file('tags.properties').newInputStream()); it }
            if (!props.isEmpty()) {
                injectedTags.set(props.collectEntries { k, v -> [(k): interpolate(v)] })
            }
        }
    }
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
}

dependencies {
    if (propertyBool('use_modern_java_syntax')) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        // Workaround for https://github.com/bsideup/jabel/issues/174
        annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
        compileOnly ('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false
        }
        // Allow jdk.unsupported classes like sun.misc.Unsafe, workaround for JDK-8206937 and fixes crashes in tests
        patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'
        // Include for tests
        testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        testCompileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false // We only care about the 1 annotation class
        }
    }
    if (propertyBool('use_asset_mover')) {
        implementation "com.cleanroommc:assetmover:${propertyString('asset_mover_version')}"
    }
    if (propertyBool('use_mixins')) {
        String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${propertyString('mixin_booter_version')}", propertyString('mixin_refmap'))
        api (mixin) {
            transitive = false
        }
        annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
        annotationProcessor 'com.google.guava:guava:32.1.2-jre'
        annotationProcessor 'com.google.code.gson:gson:2.8.9'
        annotationProcessor (mixin) {
            transitive = false
        }
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

// Adds Access Transformer files to tasks
if (propertyBool('use_access_transformer')) {
    for (def location : propertyStringList('access_transformer_locations')) {
        def fileLocation = file("${projectDir}/src/main/resources/${location}")
        if (fileLocation.exists()) {
            tasks.deobfuscateMergedJarToSrg.accessTransformerFiles.from(fileLocation)
            tasks.srgifyBinpatchedJar.accessTransformerFiles.from(fileLocation)
        } else {
            throw new GradleException("Access Transformer file [$fileLocation] does not exist!")
        }
    }
}

processResources {

    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')
    inputs.property 'mixin_refmap', propertyString('mixin_refmap')
    inputs.property 'mixin_package', propertyString('mixin_package')
    inputs.property 'mixin_configs', propertyStringList('mixin_configs').join(' ')

    def filterList = ['mcmod.info', 'pack.mcmeta']
    filterList.addAll(propertyStringList('mixin_configs').collect(config -> "mixins.${config}.json" as String))

    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'mixin_refmap': propertyString('mixin_refmap'),
                'mixin_package': propertyString('mixin_package')
        )
    }
    
    if (propertyBool('use_access_transformer')) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }

}

jar {
    manifest {
        def attribute_map = [:]
        if (propertyBool('is_coremod')) {
            attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            if (propertyBool('coremod_includes_mod')) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
                def currentTasks = gradle.startParameter.taskNames
                if (currentTasks[0] == 'build' || currentTasks[0] == 'prepareObfModsFolder' || currentTasks[0] == 'runObfClient') {
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
        }
        if (propertyBool('use_access_transformer')) {
            attribute_map['FMLAT'] = propertyString('access_transformer_locations')
        }
        attributes(attribute_map)
    }
    // Add all embedded dependencies into the jar
    from(provider{ configurations.embed.collect {it.isDirectory() ? it : zipTree(it)} })
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/mixins.${config}.json").exists())
    onlyIf {
        if (propertyBool('use_mixins') && propertyBool('generate_mixins_json')) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/mixins.${mixinConfig}.json")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${propertyString('mixin_refmap')}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax')) {
        if (it.name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
    dependsOn 'injectTags', 'generateMixinJson'
}

if (propertyBool('use_modern_java_syntax')) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

tasks.named('injectTags', InjectTagsTask).configure {
    onlyIf {
        return propertyBool('use_tags') && !it.getTags().get().isEmpty()
    }
    it.outputClassName.set(propertyString('tag_class_name'))
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'


import groovy.json.JsonOutput

def MODID = "travellers"
def SOUND_ROOT_TRAV = "travellers"              // sounds/travellers/<lang>/<personality>/<kind>/*.ogg
def SOUND_ROOT_RAID = "travellers/raiders"      // sounds/travellers/raiders/<lang>/<personality>/<kind>/*.ogg

tasks.register('generateDynamicSounds') {
    group = "build setup"
    description = "Generates sounds.json + voices/index.json + voices/raiders_index.json from assets sounds folder structure with per-clip events"

    doLast {
        def soundsBase = file("$projectDir/src/main/resources/assets/${MODID}/sounds")
        if (!soundsBase.exists()) {
            println "[generateDynamicSounds] No sounds folder: ${soundsBase}"
            return
        }

        def travBase = new File(soundsBase, SOUND_ROOT_TRAV)
        def raidBase = new File(soundsBase, SOUND_ROOT_RAID)

        def soundsJsonOut = file("$projectDir/src/main/resources/assets/${MODID}/sounds.json")

        def voicesDir = file("$projectDir/src/main/resources/assets/${MODID}/voices")
        voicesDir.mkdirs()

        def travIndexOut = file("$voicesDir/index.json")
        def raidIndexOut = file("$voicesDir/raiders_index.json")

        def kinds = ["talk", "hurt", "hello", "ambient", "attack", "creeper", "kill", "death"]
        def soundsMap = [:]

        def mkIndex = { String defLang, String defPers ->
            return [
                    defaultLang       : defLang,
                    defaultPersonality: defPers,
                    langs             : [:],   // lang -> [personality1, personality2...]
                    clips             : [:]    // lang -> personality -> kind -> [eventKey1, eventKey2...]
            ]
        }

        def travIndex = mkIndex("en", "default")
        def raidIndex = mkIndex("en", "default")

        def dirChildren = { File f ->
            def kids = f.listFiles()
            if (kids == null) return []
            return kids.findAll { it.isDirectory() }
        }

        def oggsIn = { File f ->
            def kids = f.listFiles()
            if (kids == null) return []
            def files = kids.findAll { it.isFile() && it.name.toLowerCase().endsWith(".ogg") }
            def withSpaces = files.findAll { it.name.contains(" ") }
            if (!withSpaces.isEmpty()) {
                throw new GradleException("[generateDynamicSounds] OGG filenames must not contain spaces:\n" +
                    withSpaces.collect { "  " + it.absolutePath }.join("\n"))
            }
            return files.sort { a, b -> a.name <=> b.name }
        }

        // Parse OGG Vorbis file and return duration in ticks (20 ticks/s). Returns 0 on error.
        def readOggDurationTicks = { File oggFile ->
            try {
                RandomAccessFile raf = new RandomAccessFile(oggFile, "r")
                long fileLen = raf.length()
                if (fileLen < 27) { raf.close(); return 0 }

                int sampleRate = 44100
                int headerSize = (int) Math.min(256L, fileLen)
                byte[] header = new byte[headerSize]
                raf.read(header)
                for (int i = 0; i < headerSize - 15; i++) {
                    if (header[i] == (byte)1 && header[i+1] == (byte)'v' && header[i+2] == (byte)'o' &&
                        header[i+3] == (byte)'r' && header[i+4] == (byte)'b' &&
                        header[i+5] == (byte)'i' && header[i+6] == (byte)'s') {
                        sampleRate = ((header[i+12] & 0xFF)) | ((header[i+13] & 0xFF) << 8) |
                                     ((header[i+14] & 0xFF) << 16) | ((header[i+15] & 0xFF) << 24)
                        break
                    }
                }

                int scanSize = (int) Math.min(65536L, fileLen)
                byte[] tail = new byte[scanSize]
                raf.seek(fileLen - scanSize)
                raf.read(tail)
                raf.close()

                long granule = 0L
                for (int i = tail.length - 27; i >= 0; i--) {
                    if (tail[i] == (byte)'O' && tail[i+1] == (byte)'g' &&
                        tail[i+2] == (byte)'g' && tail[i+3] == (byte)'S') {
                        long g = 0L
                        for (int b = 0; b < 8; b++) {
                            g |= ((long)(tail[i + 6 + b] & 0xFF)) << (b * 8)
                        }
                        if (g > 0L && g != -1L) { granule = g; break }
                    }
                }

                if (sampleRate <= 0 || granule <= 0L) return 0
                return (int) Math.ceil((double) granule / sampleRate * 20.0)
            } catch (Exception ignored) { return 0 }
        }

        def emitCategory = { File baseDir, String eventPrefix, String soundNamePrefix, def indexObj ->
            if (!baseDir.exists() || !baseDir.isDirectory()) {
                println "[generateDynamicSounds] Missing folder: ${baseDir}"
                return
            }

            dirChildren(baseDir).each { File langDir ->
                def lang = langDir.name.toLowerCase()
                if (baseDir.name == "travellers" && lang == "raiders") {
                    return
                }

                def personalities = dirChildren(langDir).collect { it.name.toLowerCase() }.sort()
                indexObj.langs[lang] = personalities
                indexObj.clips[lang] = indexObj.clips[lang] ?: [:]

                dirChildren(langDir).each { File persDir ->
                    def personality = persDir.name.toLowerCase()
                    indexObj.clips[lang][personality] = indexObj.clips[lang][personality] ?: [:]

                    kinds.each { String kind ->
                        def kindDir = new File(persDir, kind)
                        if (!kindDir.exists() || !kindDir.isDirectory()) {
                            indexObj.clips[lang][personality][kind] = []
                            return
                        }

                        def files = oggsIn(kindDir)
                        if (files.isEmpty()) {
                            indexObj.clips[lang][personality][kind] = []
                            return
                        }

                        def aggregateEventKey = "${eventPrefix}.${lang}.${personality}.${kind}"
                        def aggregateEntries = []
                        def exactEventKeys = []
                        boolean anyNeedsStream = false

                        files.eachWithIndex { File ogg, int i ->
                            def baseName = ogg.name.substring(0, ogg.name.length() - 4)

                            def soundPath = "${MODID}:${soundNamePrefix}/${lang}/${personality}/${kind}/${baseName}"

                            def exactEventKey = "${eventPrefix}.${lang}.${personality}.${kind}.__${i}"
                            exactEventKeys << exactEventKey

                            boolean shouldStream = (readOggDurationTicks(ogg) > 60)
                            if (shouldStream) anyNeedsStream = true
                            aggregateEntries << [name: soundPath, stream: shouldStream]
                            soundsMap[exactEventKey] = [
                                    category: "voice",
                                    sounds  : [[name: soundPath, stream: shouldStream]]
                            ]
                            if (kind == "talk" || kind == "hello") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.talk"
                            if (kind == "hurt") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.hurt"
                            if (kind == "attack") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.attack"
                            if (kind == "creeper") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.creeper"
                            if (kind == "kill") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.kill"
                            if (kind == "death") soundsMap[exactEventKey].subtitle = "subtitles.entity.travellers.death"
                        }

                        soundsMap[aggregateEventKey] = [
                                category: "voice",
                                sounds  : aggregateEntries
                        ]
                        if (kind == "talk" || kind == "hello") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.talk"
                        if (kind == "hurt") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.hurt"
                        if (kind == "attack") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.attack"
                        if (kind == "creeper") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.creeper"
                        if (kind == "kill") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.kill"
                        if (kind == "death") soundsMap[aggregateEventKey].subtitle = "subtitles.entity.travellers.death"

                        indexObj.clips[lang][personality][kind] = exactEventKeys
                    }
                }
            }
        }

        emitCategory(
                travBase,
                "entity.travellers",
                SOUND_ROOT_TRAV,
                travIndex
        )

        emitCategory(
                raidBase,
                "entity.travellers.raiders",
                SOUND_ROOT_RAID,
                raidIndex
        )

        // ---- Dialogue-only personalities: character sheets with no sound folder at all ----
        // A personality can exist purely as assets/travellers/personalities/<lang>/<id>.md (see
        // PersonalityProfileLoader) with no matching sounds/travellers/<lang>/<id>/ folder. It still
        // has to appear in travIndex.langs so CultureRegistry.pickRandomTravellerPersonalityId can
        // actually assign it at spawn; it carries no clips (CultureRegistry falls back to the
        // culture's default voice set for a personality whose VoiceSet is entirely empty). Raiders
        // are out of scope - they have no friendly dialogue to begin with.
        def personalitiesBase = file("$projectDir/src/main/resources/assets/${MODID}/personalities")
        if (personalitiesBase.exists()) {
            dirChildren(personalitiesBase).each { File langDir ->
                def lang = langDir.name.toLowerCase()
                def mdFiles = langDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase().endsWith(".md") } ?: []
                if (mdFiles.isEmpty()) return

                def existing = (travIndex.langs[lang] ?: []) as Set
                def soundless = mdFiles.collect { it.name.substring(0, it.name.length() - 3).toLowerCase() }
                        .findAll { !existing.contains(it) }
                if (soundless.isEmpty()) return

                travIndex.langs[lang] = ((travIndex.langs[lang] ?: []) + soundless).sort()
                travIndex.clips[lang] = travIndex.clips[lang] ?: [:]
                soundless.each { String personality ->
                    travIndex.clips[lang][personality] = [:]
                    kinds.each { String kind -> travIndex.clips[lang][personality][kind] = [] }
                }
                println "[generateDynamicSounds] Sound-less personalities for ${lang}: ${soundless.join(', ')}"
            }
        }

        // ---- Choir songs ----
        // Structure: sounds/travellers/<lang>/<personality>/choir/<songName>/<stem_N>.ogg
        // choir_index.json: { songs: {...}, aliases: {...}, durationTicks per song }
        def choirIndex = [:]   // lang -> personality -> [{ name, stems, durationTicks }]

        def emitChoir = { File baseDir, String eventPrefix, String soundNamePrefix ->
            if (!baseDir.exists() || !baseDir.isDirectory()) return
            dirChildren(baseDir).each { File langDir ->
                def lang = langDir.name.toLowerCase()
                if (baseDir.name == "travellers" && lang == "raiders") return

                dirChildren(langDir).each { File persDir ->
                    def personality = persDir.name.toLowerCase()
                    def choirDir = new File(persDir, "choir")
                    if (!choirDir.exists() || !choirDir.isDirectory()) return

                    choirIndex[lang] = choirIndex[lang] ?: [:]
                    choirIndex[lang][personality] = choirIndex[lang][personality] ?: []

                    dirChildren(choirDir).sort { a, b -> a.name <=> b.name }.each { File songDir ->
                        def songName = songDir.name.toLowerCase()
                        def stemFiles = oggsIn(songDir)
                        if (stemFiles.isEmpty()) return

                        def stemKeys = []
                        int maxDurationTicks = 0
                        stemFiles.eachWithIndex { File ogg, int i ->
                            def baseName = ogg.name.substring(0, ogg.name.length() - 4)
                            def soundPath = "${MODID}:${soundNamePrefix}/${lang}/${personality}/choir/${songName}/${baseName}"
                            def eventKey = "${eventPrefix}.${lang}.${personality}.choir.${songName}.__${i}"
                            stemKeys << eventKey
                            soundsMap[eventKey] = [
                                    category: "voice",
                                    sounds  : [[name: soundPath, stream: true]]
                            ]
                            int dur = readOggDurationTicks(ogg)
                            if (dur > maxDurationTicks) maxDurationTicks = dur
                        }
                        choirIndex[lang][personality] << [name: songName, stems: stemKeys, durationTicks: maxDurationTicks]
                    }
                }
            }
        }

        emitChoir(travBase, "entity.travellers", SOUND_ROOT_TRAV)

        def choirIndexOut = file("$voicesDir/choir_index.json")
        // Preserve manually-edited aliases from the existing choir_index.json
        def existingAliases = [:]
        if (choirIndexOut.exists()) {
            try {
                def parsed = new groovy.json.JsonSlurper().parse(choirIndexOut)
                if (parsed?.aliases) existingAliases = parsed.aliases
            } catch (Exception ignored) {}
        }
        def choirIndexData = [songs: choirIndex]
        if (!existingAliases.isEmpty()) choirIndexData.aliases = existingAliases
        choirIndexOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(choirIndexData)) + "\n"
        println "[generateDynamicSounds] Wrote ${choirIndexOut} (${choirIndex.size()} langs)"

        soundsJsonOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(soundsMap)) + "\n"
        println "[generateDynamicSounds] Wrote ${soundsJsonOut} with ${soundsMap.size()} events"

        travIndexOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(travIndex)) + "\n"
        println "[generateDynamicSounds] Wrote ${travIndexOut}"

        raidIndexOut.text = JsonOutput.prettyPrint(JsonOutput.toJson(raidIndex)) + "\n"
        println "[generateDynamicSounds] Wrote ${raidIndexOut}"
    }
}

processResources.dependsOn(generateDynamicSounds)

tasks.register('deployToServer', Exec) {
    group = 'deployment'
    description = 'Copies production jar to travellers-latest.jar and deploys to server'
    mustRunAfter 'build'
    commandLine 'bash', "${projectDir}/deploy.sh"
}

tasks.named('build').configure { finalizedBy 'deployToServer' }
